name: Vòng Đời Cơ Bắp Vận Động (Motor HA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write

jobs:
  run-motor:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Cơ Bắp
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. DÒ TÌM LỆNH VẬN ĐỘNG TỪ BỘ NÃO
      - name: Xúc tu vươn vòi tìm Não phả hệ
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_PARENT: ${{ github.event.repository.parent.owner.login }}
        run: python receptors/cascade_receptor.py

      - name: Anten bắt sóng Bộ Não toàn cầu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python receptors/mesh_receptor.py

      # 2. MÀNG MIỄN DỊCH KIỂM ĐỊNH LỆNH
      - name: Màng miễn dịch lọc xung kích thích
        run: python receptors/contract_receptor.py

      # 3. VẬN HÀNH CƠ BẮP PHÁT LỰC
      - name: Vận hành Động cơ Cơ Bắp
        run: python motor_engine.py

      # 4. LƯU VẾT TÍCH HÀNH ĐỘNG VÀO GIT (FAST-FORWARD CHỐNG XUNG ĐỘT)
      - name: Phát vector hành động lên môi trường mạng
        run: |
          git config --global user.name "Motor-Effector-Bot"
          git config --global user.email "bot@motor.node"
          
          git fetch origin main
          git reset origin/main
          git add synapses/ motor_action.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🦾 [Hành Động Cơ Bắp] Cơ vừa co duỗi phát lực [skip ci]"
            git push origin main
          else
            echo "Không có biến đổi mới."
          fi
